# Throwaway Snipe-IT for integration tests. `bash test/snipeit-up.sh` brings it up and seeds demo data.
services:
  app:
    image: snipe/snipe-it:latest
    ports: ["8765:80"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: base64:3ilviXqB9u6DX1NRcyWGJ+sjySF+H18CPDGb3+IVwMQ=
      APP_URL: http://localhost:8765
      APP_TIMEZONE: UTC
      APP_LOCALE: en-US
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: snipeit
      DB_USERNAME: snipeit
      DB_PASSWORD: snipeit
      MAIL_MAILER: log
      MAIL_FROM_ADDR: test@example.com
      MAIL_FROM_NAME: Snipe-IT
  db:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: snipeit
      MYSQL_USER: snipeit
      MYSQL_PASSWORD: snipeit
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 2s
      retries: 30
